<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RPG Survival - Mapa 3D</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #info { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); color: #fff; padding: 12px 20px; border-radius: 8px; z-index: 10; pointer-events: none; border-left: 4px solid #ff4444; }
        #stats { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); color: #0f0; padding: 10px 15px; border-radius: 8px; z-index: 10; font-family: monospace; font-size: 14px; pointer-events: none; }
        
        /* Modal de Interação */
        #modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #modal-content {
            background: #1e1e1e;
            color: #eee;
            padding: 30px;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #444;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }
        #modal-content h2 { margin-top: 0; color: #ffaa44; border-bottom: 1px solid #333; padding-bottom: 10px; }
        #modal-content .interacao-item {
            background: #2a2a2a;
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #ffaa44;
            cursor: pointer;
            transition: 0.2s;
        }
        #modal-content .interacao-item:hover { background: #3a3a3a; transform: scale(1.01); }
        #modal-content .interacao-item .tipo { font-weight: bold; color: #88ccff; }
        #modal-content .fechar { 
            background: #ff4444; color: #fff; border: none; 
            padding: 10px 20px; border-radius: 8px; 
            cursor: pointer; float: right; margin-top: 10px;
            font-weight: bold;
        }
        #modal-content .fechar:hover { background: #cc0000; }
        .zumbi-count { color: #ff8888; font-weight: bold; }
    </style>
</head>
<body>
    <div id="info">🧟 ZUMBI APOCALIPSE RPG - Clique em um prédio para interagir</div>
    <div id="stats">Zumbis: <span id="zumbi-counter">0</span> | Prédios: <span id="predio-counter">0</span></div>
    
    <!-- Modal -->
    <div id="modal">
        <div id="modal-content">
            <h2 id="modal-title">Prédio</h2>
            <div id="modal-interacoes"></div>
            <button class="fechar" onclick="fecharModal()">Sair do Prédio</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ===== SETUP =====
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.Fog(0x0a0a1a, 50, 90); // Névoa para esconder zumbis distantes

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 150);
        camera.position.set(35, 40, 35);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.target.set(0, 2, 0);
        controls.maxDistance = 80;
        controls.minDistance = 5;

        // ===== LUZES =====
        const ambient = new THREE.AmbientLight(0x334466, 0.6);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffdd99, 1.8);
        sun.position.set(30, 40, 20);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 1;
        sun.shadow.camera.far = 100;
        sun.shadow.camera.left = -60;
        sun.shadow.camera.right = 60;
        sun.shadow.camera.top = 60;
        sun.shadow.camera.bottom = -60;
        scene.add(sun);
        const back = new THREE.DirectionalLight(0x4488ff, 0.3);
        back.position.set(-20, 10, -30);
        scene.add(back);

        // ===== CHÃO =====
        const gridHelper = new THREE.GridHelper(130, 25, 0x88aaff, 0x334466);
        gridHelper.position.y = -0.01;
        scene.add(gridHelper);

        // ===== CARREGAR DADOS =====
        let prediosData = [];
        let zumbisData = [];
        let buildingMeshes = [];

        fetch('cidade_rpg.json')
            .then(res => res.json())
            .then(data => {
                prediosData = data.predios;
                zumbisData = data.zumbis;
                document.getElementById('zumbi-counter').textContent = zumbisData.length;
                document.getElementById('predio-counter').textContent = prediosData.length;

                // ----- CONSTRUIR PRÉDIOS -----
                const buildingGroup = new THREE.Group();
                prediosData.forEach(b => {
                    const geo = new THREE.BoxGeometry(b.largura, b.altura, b.profundidade);
                    const mat = new THREE.MeshStandardMaterial({
                        color: b.cor,
                        roughness: 0.7,
                        metalness: 0.1,
                        emissive: new THREE.Color(b.cor).multiplyScalar(0.08)
                    });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(b.x, b.altura/2, b.z);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    mesh.userData = { 
                        isBuilding: true, 
                        data: b,
                        id: b.id
                    };
                    buildingGroup.add(mesh);
                    buildingMeshes.push(mesh);

                    // Teto (uma linha fina para destacar)
                    const topMat = new THREE.MeshStandardMaterial({ color: 0x222222, emissive: new THREE.Color(b.cor).multiplyScalar(0.2) });
                    const top = new THREE.Mesh(new THREE.BoxGeometry(b.largura*0.8, 0.1, b.profundidade*0.8), topMat);
                    top.position.set(b.x, b.altura + 0.05, b.z);
                    buildingGroup.add(top);
                });
                scene.add(buildingGroup);

                // ----- CONSTRUIR ZUMBIS (InstancedMesh) -----
                // Criar um zumbi simples (corpo + cabeça) mesclado
                const zombieGroup = new THREE.Group();
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.8, 0.3));
                body.position.y = 0.4;
                const head = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.25));
                head.position.y = 0.9;
                zombieGroup.add(body);
                zombieGroup.add(head);
                
                // Converter para BufferGeometry mesclado
                const mergedGeo = new THREE.BufferGeometry();
                const tempMat = new THREE.MeshStandardMaterial();
                const tempMesh = new THREE.Mesh(zombieGroup.children[0]);
                // Simplificando: vamos usar um único BoxGeometry para performance máxima
                // Um zumbi estilizado como um "pino" (cone + esfera)
                const zombieGeo = new THREE.CylinderGeometry(0.2, 0.4, 1.0, 4); // 4 lados para parecer low-poly
                const zombieMat = new THREE.MeshStandardMaterial({ 
                    color: 0x66aa66, 
                    emissive: 0x224422, 
                    emissiveIntensity: 0.2,
                    roughness: 0.9 
                });
                
                const dummy = new THREE.Object3D();
                const instanceMesh = new THREE.InstancedMesh(zombieGeo, zombieMat, zumbisData.length);
                instanceMesh.castShadow = true;
                instanceMesh.receiveShadow = true;

                // Posicionar cada zumbi
                const pos = new THREE.Vector3();
                const quat = new THREE.Quaternion();
                const scale = new THREE.Vector3(0.5 + Math.random()*0.3, 0.8 + Math.random()*0.4, 0.5 + Math.random()*0.3);
                
                zumbisData.forEach((z, i) => {
                    pos.set(z.x, 0.5 + (z.offset_y || 0), z.z);
                    // Pequena rotação aleatória
                    quat.setFromAxisAngle(new THREE.Vector3(0,1,0), Math.random() * Math.PI * 2);
                    instanceMesh.setMatrixAt(i, dummy.matrix);
                    // Atualizar posição via matrix (mais rápido)
                    dummy.position.copy(pos);
                    dummy.quaternion.copy(quat);
                    dummy.scale.set(scale.x, scale.y, scale.z);
                    dummy.updateMatrix();
                    instanceMesh.setMatrixAt(i, dummy.matrix);
                });
                instanceMesh.instanceMatrix.needsUpdate = true;
                scene.add(instanceMesh);

                // Guardar referência para animação futura (bobear)
                window.zombieMesh = instanceMesh;
                window.zombiePositions = zumbisData.map(z => new THREE.Vector3(z.x, 0.5 + (z.offset_y || 0), z.z));
                window.time = 0;

                // ----- CLICK INTERATIVO (Raycaster) -----
                const raycaster = new THREE.Raycaster();
                const pointer = new THREE.Vector2();
                renderer.domElement.style.cursor = 'default';

                renderer.domElement.addEventListener('click', (event) => {
                    pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
                    pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(pointer, camera);
                    
                    const intersects = raycaster.intersectObjects(buildingMeshes);
                    if (intersects.length > 0) {
                        const obj = intersects[0].object;
                        if (obj.userData.isBuilding) {
                            abrirModal(obj.userData.data);
                        }
                    }
                });

                // Hover para mudar cursor
                renderer.domElement.addEventListener('pointermove', (event) => {
                    pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
                    pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(pointer, camera);
                    const intersects = raycaster.intersectObjects(buildingMeshes);
                    renderer.domElement.style.cursor = intersects.length > 0 ? 'pointer' : 'default';
                });

                // Ajustar câmera
                const box = new THREE.Box3().setFromObject(buildingGroup);
                const center = new THREE.Vector3();
                box.getCenter(center);
                controls.target.copy(center);
            })
            .catch(err => console.error("Erro ao carregar JSON:", err));

        // ===== FUNÇÃO MODAL (global) =====
        window.abrirModal = function(data) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const container = document.getElementById('modal-interacoes');
            
            title.innerHTML = `🏚️ ${data.nome} <span style="font-size:14px; color:#aaa;">(${data.tipo})</span>`;
            container.innerHTML = '';
            
            data.interacoes.forEach((inter, index) => {
                const div = document.createElement('div');
                div.className = 'interacao-item';
                const emoji = inter.tipo === 'zumbi' ? '🧟' : inter.tipo === 'loot' ? '🔫' : inter.tipo === 'safe' ? '🛏️' : inter.tipo === 'trap' ? '⚠️' : inter.tipo === 'npc' ? '🧑‍🤝‍🧑' : '📦';
                div.innerHTML = `<span class="tipo">${emoji} ${inter.tipo.toUpperCase()}</span><br>${inter.desc}`;
                div.addEventListener('click', () => {
                    alert(`[${data.nome}] Você escolheu: ${inter.desc}\n(Simulação de rolagem de dados aqui!)`);
                    // Aqui você pode implementar lógica de dados, perda de vida, etc.
                });
                container.appendChild(div);
            });
            
            modal.style.display = 'flex';
        };

        window.fecharModal = function() {
            document.getElementById('modal').style.display = 'none';
        };

        // Fechar modal clicando fora
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) fecharModal();
        });

        // ===== ANIMAÇÃO (zumbis balançando levemente) =====
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            // Animar zumbis (bobear/andar lentamente)
            if (window.zombieMesh && window.zombiePositions) {
                const time = Date.now() * 0.001;
                const mesh = window.zombieMesh;
                const dummy = new THREE.Object3D();
                const pos = new THREE.Vector3();
                const quat = new THREE.Quaternion();
                
                // Atualizar apenas os primeiros 5000 para performance, ou todos se quiser
                // Vamos atualizar todos mas com uma lógica super leve
                const count = Math.min(window.zombiePositions.length, mesh.count);
                for (let i = 0; i < count; i++) {
                    const base = window.zombiePositions[i];
                    // Movimento de "respiração" / zumbi cambaleante
                    const offsetY = Math.sin(time * 0.8 + i) * 0.03;
                    const offsetX = Math.sin(time * 0.5 + i * 0.5) * 0.02;
                    const offsetZ = Math.cos(time * 0.6 + i * 0.7) * 0.02;
                    
                    pos.set(base.x + offsetX, base.y + offsetY, base.z + offsetZ);
                    dummy.position.copy(pos);
                    dummy.quaternion.setFromAxisAngle(new THREE.Vector3(0,1,0), Math.sin(time + i) * 0.02);
                    dummy.scale.set(0.5, 0.8, 0.5);
                    dummy.updateMatrix();
                    mesh.setMatrixAt(i, dummy.matrix);
                }
                mesh.instanceMatrix.needsUpdate = true;
            }
            
            renderer.render(scene, camera);
        }
        animate();

        // ===== RESPONSIVO =====
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
